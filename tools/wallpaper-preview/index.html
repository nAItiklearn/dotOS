<!doctype html>
<meta charset="utf-8">
<title>DotOS wallpaper preview</title>
<!--
  Browser harness that renders the AGSL shaders from feature/wallpaper/.../wallpapers/*.kt through
  WebGL2 (mechanical AGSL -> GLSL ES 3.00 translation, see kotlin-parse.js). Serve the repo root:
    python -m http.server 8765      (then open http://localhost:8765/tools/wallpaper-preview/index.html?w=grain_totem&ui=1)
  Query: w, preset, s (css scale of 621x1380), res (internal px width), t, anim=1, ui=1, hour, scroll,
         p.<param>=<value>, c.<slot>=<rrggbb>, file=<Name.kt>
-->
<style>
  html, body { margin: 0; overflow: hidden; background: #202020; color: #ddd; font: 12px/1.3 monospace; }
  canvas { display: block; }
  #status { white-space: pre-wrap; padding: 2px 4px; color: #7a7; position: fixed; left: 0; bottom: 0; background: #000a; max-width: 100%; }
  #status.bad { color: #f66; }
  #ui { display: none; position: fixed; right: 0; top: 0; background: #000c; padding: 6px; }
  #ui div { margin: 2px 0; }
</style>
<canvas id="c"></canvas>
<div id="status"></div>
<div id="ui"></div>
<script type="module" src="preview.js"></script>
