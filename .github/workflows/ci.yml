name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.DOTOS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dotos.p12"
            echo "DOTOS_KEYSTORE=$RUNNER_TEMP/dotos.p12" >> "$GITHUB_ENV"
          fi

      - name: Build, unit tests, lint
        env:
          DOTOS_KEYSTORE_PASSWORD: ${{ secrets.DOTOS_KEYSTORE_PASSWORD }}
          DOTOS_KEY_ALIAS: ${{ secrets.DOTOS_KEY_ALIAS }}
          DOTOS_KEY_PASSWORD: ${{ secrets.DOTOS_KEY_PASSWORD }}
        run: ./gradlew --stacktrace assembleDebug assembleRelease testDebugUnitTest lintRelease

      - name: Privacy check — no network permissions in the APK
        run: |
          set -e
          AAPT2=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2
          for apk in app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk; do
            echo "== $apk"
            "$AAPT2" dump permissions "$apk" | tee perms.txt
            if grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION)|AD_ID" perms.txt; then
              echo "::error::Forbidden permission found in $apk"; exit 1
            fi
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: dotos-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/**
          if-no-files-found: ignore
