name: Release

# Push a tag like v1.0.0 to build a signed APK and publish a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.DOTOS_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::DOTOS_KEYSTORE_B64 secret missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dotos.p12"
          echo "DOTOS_KEYSTORE=$RUNNER_TEMP/dotos.p12" >> "$GITHUB_ENV"

      - name: Build signed release
        env:
          DOTOS_KEYSTORE_PASSWORD: ${{ secrets.DOTOS_KEYSTORE_PASSWORD }}
          DOTOS_KEY_ALIAS: ${{ secrets.DOTOS_KEY_ALIAS }}
          DOTOS_KEY_PASSWORD: ${{ secrets.DOTOS_KEY_PASSWORD }}
        run: ./gradlew --stacktrace assembleRelease testDebugUnitTest -PversionCode=${{ steps.v.outputs.code }} -PversionName=${{ steps.v.outputs.name }}

      - name: Verify signature and privacy
        run: |
          set -e
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee certs.txt
          grep -q "CN=DotOS Launcher" certs.txt || { echo "::error::APK not signed with the DotOS release key"; exit 1; }
          if "$BT/aapt2" dump permissions "$APK" | grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE)"; then echo "::error::network permission"; exit 1; fi
          mkdir -p dist
          cp "$APK" "dist/DotOS-Launcher-${{ steps.v.outputs.name }}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.name }}"
          NOTES=$(cat fastlane/metadata/android/en-US/changelogs/1.txt 2>/dev/null || echo "DotOS Launcher $TAG")
          gh release view "$TAG" >/dev/null 2>&1 && gh release upload "$TAG" dist/* --clobber || \
            gh release create "$TAG" dist/* --title "DotOS Launcher ${{ steps.v.outputs.name }}" --notes "$NOTES

          Unofficial fan-made project, not affiliated with Nothing Technology Limited.
          Install the APK, then set DotOS as your default Home app. Collects nothing, sends nothing." 
